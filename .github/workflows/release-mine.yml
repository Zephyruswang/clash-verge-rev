name: Release Mine

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream app release tag (default: latest)"
        required: false

permissions:
  contents: write

env:
  HUSKY: 0
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  release:
    name: Build Windows installer from upstream release
    runs-on: windows-latest
    steps:
      - name: Resolve target release
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_TAG:-}"
          if [ -n "$requested" ]; then
            if [[ ! "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag: $requested" >&2
              exit 1
            fi
            tag="$requested"
          else
            tag="$(gh api repos/clash-verge-rev/clash-verge-rev/releases/latest --jq .tag_name)"
          fi
          base="${tag#v}"
          major="${base%%.*}"
          rest="${base#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          fork_base="${major}.${minor}.$((patch + 1))"
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' || true)"
          if [ "${{ github.event_name }}" = "schedule" ] && printf '%s\n' "$existing" | grep -qE "^v${fork_base}-mine\.[0-9]+$"; then
            echo "Release for $tag already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=1
          while printf '%s\n' "$existing" | grep -qx "v${fork_base}-mine.${n}"; do
            n=$((n + 1))
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${fork_base}-mine.${n}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${fork_base}-mine.${n}" >> "$GITHUB_OUTPUT"
          echo "Target: $tag -> v${fork_base}-mine.${n}"

      - name: Clone app at upstream tag
        if: steps.target.outputs.skip != 'true'
        shell: bash
        env:
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: git clone --depth 1 --branch "$TARGET_TAG" https://github.com/clash-verge-rev/clash-verge-rev.git app

      - name: Read pnpm version from upstream tag
        id: pnpmver
        if: steps.target.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oE '"packageManager": *"pnpm@[^"]+"' app/package.json | sed -E 's/.*pnpm@([^"]+)".*/\1/')"
          if [ -z "$version" ]; then
            echo "No packageManager field in app/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp fork version
        if: steps.target.outputs.skip != 'true'
        working-directory: app
        shell: bash
        env:
          APP_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg version "$APP_VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "package.json version: $(jq -r .version package.json)"

      - name: Clone service mainline
        if: steps.target.outputs.skip != 'true'
        shell: bash
        run: git clone --depth 1 --branch main-mine https://github.com/Zephyruswang/clash-verge-service-ipc.git service

      - name: Verify service version compatibility
        if: steps.target.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          app_pin="$(grep -A6 'clash_verge_service_ipc =' app/src-tauri/Cargo.toml | grep -oE 'version = "[^"]+"' | head -1 | cut -d'"' -f2)"
          svc_ver="$(grep -m1 '^version = "' service/Cargo.toml | cut -d'"' -f2)"
          echo "app pins service-ipc: $app_pin; service fork: $svc_ver"
          if [ -n "$app_pin" ] && [ "$app_pin" != "$svc_ver" ]; then
            newest="$(printf '%s\n%s\n' "$app_pin" "$svc_ver" | sort -V | tail -1)"
            if [ "$newest" = "$app_pin" ]; then
              echo "Service fork ($svc_ver) is older than the app pin ($app_pin); sync main-mine first." >&2
              exit 1
            fi
          fi

      - name: Setup Node
        if: steps.target.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"

      - name: Setup pnpm
        if: steps.target.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpmver.outputs.version }}
          run_install: false

      - name: Install app dependencies
        if: steps.target.outputs.skip != 'true'
        working-directory: app
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Prepare runtime resources
        if: steps.target.outputs.skip != 'true'
        working-directory: app
        shell: bash
        run: pnpm run prebuild x86_64-pc-windows-msvc

      - name: Install Rust toolchain
        if: steps.target.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Build patched service
        if: steps.target.outputs.skip != 'true'
        working-directory: service
        shell: bash
        run: cargo build --release --features "standalone client"

      - name: Bundle patched service
        if: steps.target.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in clash-verge-service.exe clash-verge-service-install.exe clash-verge-service-uninstall.exe; do
            cp "service/target/release/$f" "app/src-tauri/resources/$f"
          done
          sha256sum app/src-tauri/resources/clash-verge-service.exe

      - name: Build Windows installer
        if: steps.target.outputs.skip != 'true'
        working-directory: app
        shell: bash
        env:
          APP_VERSION: ${{ steps.target.outputs.version }}
          UPDATER_PUBKEY: "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDI5RjQ3M0YxQjExMzI1MDIKUldRQ0pST3g4WFAwS1doWkxnMm92L1g1MzRRRjQ2anBuMGE1U2lRbnNwbGlnSE54czgxSEZZN1oK"
          UPDATER_ENDPOINT: "https://github.com/Zephyruswang/clash-verge-rev/releases/download/updater/update.json"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cfg="src-tauri/tauri.mine.conf.json"
          jq --arg version "$APP_VERSION" --arg pubkey "$UPDATER_PUBKEY" --arg endpoint "$UPDATER_ENDPOINT" \
            '.version = $version
             | .bundle.createUpdaterArtifacts = true
             | .plugins.updater.pubkey = $pubkey
             | .plugins.updater.endpoints = [$endpoint]' \
            src-tauri/tauri.conf.json > "$cfg"
          pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --config "$cfg"

      - name: Create prerelease
        if: steps.target.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          APP_VERSION: ${{ steps.target.outputs.version }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          bundle="app/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          setup="$(ls "$bundle"/*-setup.exe | head -1)"
          # GitHub stores release assets with spaces replaced by dots, so normalize the file name
          # locally and build the updater URL from the same name to keep them in sync.
          name="$(basename "$setup" | tr ' ' '.')"
          cp "$setup" "$RUNNER_TEMP/$name"
          cp "${setup}.sig" "$RUNNER_TEMP/$name.sig"
          setup="$RUNNER_TEMP/$name"
          sig="$setup.sig"
          test -f "$sig"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" "$setup" "$sig" "$RUNNER_TEMP/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clash Verge $APP_VERSION (Windows)" \
            --prerelease \
            --notes "Fork build of upstream $TARGET_TAG with the provider-cache fix. Windows x64 only. Unsigned; Windows SmartScreen may warn."
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg version "$APP_VERSION" --arg url "$url" --arg signature "$(cat "$sig")" --arg pub_date "$pub_date" --arg notes "Fork build of upstream $TARGET_TAG with the provider-cache fix." \
            '{version:$version, notes:$notes, pub_date:$pub_date, platforms:{"windows-x86_64":{signature:$signature, url:$url}}}' \
            > "$RUNNER_TEMP/update.json"
          if gh release view updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload updater "$RUNNER_TEMP/update.json" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create updater "$RUNNER_TEMP/update.json" --repo "$GITHUB_REPOSITORY" --title "updater" --notes "Fork updater channel" --prerelease
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Updater JSON: https://github.com/$GITHUB_REPOSITORY/releases/download/updater/update.json" >> "$GITHUB_STEP_SUMMARY"
